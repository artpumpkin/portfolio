name: salah-portfolio
services:
  web:
    image: salah-portfolio:${IMAGE_TAG:-local}
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3004:3000"
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
